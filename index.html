<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Expense Tracker</h1>

        <div class="budget-box">
          <label for="budgetInput">Monthly Budget</label>
          <input id="budgetInput" type="number" min="0" step="0.01" placeholder="0.00" />
        </div>
      </div>

      <div class="dashboard">
        <div class="card primary">
          <span class="label">Total Spent</span>
          <p id="totalSpent" class="value">$0.00</p>
        </div>

        <div class="card danger">
          <span class="label">Remaining</span>
          <p id="remainingBudget" class="value">$0.00</p>
        </div>

        <div class="card success">
          <span class="label">Transactions</span>
          <p id="transactionCount" class="value">0</p>
        </div>
      </div>

      <div class="content">
        <div class="panel">
          <h2>Add Expense</h2>
          <form id="expenseForm">
            <div class="field">
              <label for="title">Expense Name</label>
              <input id="title" type="text" placeholder="Groceries" required />
            </div>

            <div class="field">
              <label for="amount">Amount</label>
              <input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required />
            </div>

            <div class="field">
              <label for="category">Category</label>
              <select id="category">
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Housing">Housing</option>
                <option value="Utilities">Utilities</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Health">Health</option>
                <option value="Shopping">Shopping</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="field">
              <label for="date">Date</label>
              <input id="date" type="date" required />
            </div>

            <button class="primary-btn" type="submit">Add Expense</button>
          </form>
        </div>

        <div class="panel">
          <h2>Recent Expenses</h2>
          <div id="transactions" class="transactions"></div>
        </div>
      </div>
    </div>
    script src="script.js"></script>
  </body>
</html>
